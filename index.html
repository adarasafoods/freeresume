        function isDark(color) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return ((r * 299) + (g * 587) + (b * 114)) / 1000 < 128;
        }

        // === TOAST NOTIFICATIONS ===
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icon = {
                success: 'fa-check-circle',
                error: 'fa-times-circle',
                info: 'fa-info-circle',
                warning: 'fa-exclamation-triangle'
            }[type] || 'fa-info-circle';

            toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // === UNDO/REDO FUNCTIONALITY ===
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 50;

        function saveStateForUndo() {
            const currentState = {
                state: JSON.parse(JSON.stringify(state)),
                personalInfo: {
                    name: document.getElementById('in-name').value,
                    title: document.getElementById('in-title').value,
                    email: document.getElementById('in-email').value,
                    phone: document.getElementById('in-phone').value,
                    loc: document.getElementById('in-loc').value,
                    link: document.getElementById('in-link').value,
                    summary: document.getElementById('in-sum').value
                }
            };

            undoStack.push(currentState);
            if (undoStack.length > MAX_HISTORY) {
                undoStack.shift();
            }
            redoStack = [];
            updateUndoRedoButtons();
        }

        function undo() {
            if (undoStack.length === 0) return;

            // Save current state to redo stack
            const currentState = {
                state: JSON.parse(JSON.stringify(state)),
                personalInfo: {
                    name: document.getElementById('in-name').value,
                    title: document.getElementById('in-title').value,
                    email: document.getElementById('in-email').value,
                    phone: document.getElementById('in-phone').value,
                    loc: document.getElementById('in-loc').value,
                    link: document.getElementById('in-link').value,
                    summary: document.getElementById('in-sum').value
                }
            };
            redoStack.push(currentState);

            // Restore previous state
            const previousState = undoStack.pop();
            restoreState(previousState);

            showToast('Undo successful', 'info');
            updateUndoRedoButtons();
        }

        function redo() {
            if (redoStack.length === 0) return;

            // Save current state to undo stack
            const currentState = {
                state: JSON.parse(JSON.stringify(state)),
                personalInfo: {
                    name: document.getElementById('in-name').value,
                    title: document.getElementById('in-title').value,
                    email: document.getElementById('in-email').value,
                    phone: document.getElementById('in-phone').value,
                    loc: document.getElementById('in-loc').value,
                    link: document.getElementById('in-link').value,
                    summary: document.getElementById('in-sum').value
                }
            };
            undoStack.push(currentState);

            // Restore next state
            const nextState = redoStack.pop();
            restoreState(nextState);

            showToast('Redo successful', 'info');
            updateUndoRedoButtons();
        }

        function restoreState(savedState) {
            state = JSON.parse(JSON.stringify(savedState.state));

            document.getElementById('in-name').value = savedState.personalInfo.name || '';
            document.getElementById('in-title').value = savedState.personalInfo.title || '';
            document.getElementById('in-email').value = savedState.personalInfo.email || '';
            document.getElementById('in-phone').value = savedState.personalInfo.phone || '';
            document.getElementById('in-loc').value = savedState.personalInfo.loc || '';
            document.getElementById('in-link').value = savedState.personalInfo.link || '';
            document.getElementById('in-sum').value = savedState.personalInfo.summary || '';

            updateEditor();
            updateSectionOrder();
            render();
            updateProgress();
            updateCharCounter();
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undo-btn');
            const redoBtn = document.getElementById('redo-btn');

            if (undoBtn) undoBtn.disabled = undoStack.length === 0;
            if (redoBtn) redoBtn.disabled = redoStack.length === 0;
        }

        // === PROGRESS INDICATOR ===
        function updateProgress() {
            let completed = 0;
            const total = 8;

            const checks = {
                'check-name': !!document.getElementById('in-name').value.trim(),
                'check-title': !!document.getElementById('in-title').value.trim(),
                'check-contact': !!(document.getElementById('in-email').value.trim() || document.getElementById('in-phone').value.trim()),
                'check-summary': !!document.getElementById('in-sum').value.trim(),
                'check-experience': state.exp.length > 0 && state.exp.some(e => e.t1),
                'check-education': state.edu.length > 0 && state.edu.some(e => e.t1),
                'check-skills': state.skill.length > 0 && state.skill.some(s => s.t1),
                'check-languages': state.lang.length > 0 && state.lang.some(l => l.t1)
            };

            Object.entries(checks).forEach(([id, isComplete]) => {
                const el = document.getElementById(id);
                if (el) {
                    if (isComplete) {
                        el.classList.add('completed');
                        el.querySelector('i').className = 'fas fa-check-circle';
                        completed++;
                    } else {
                        el.classList.remove('completed');
                        el.querySelector('i').className = 'fas fa-circle';
                    }
                }
            });

            const percentage = Math.round((completed / total) * 100);
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-percentage');

            if (progressBar) progressBar.style.width = percentage + '%';
            if (progressText) progressText.textContent = percentage + '%';
        }

        // === CHARACTER COUNTER ===
        function updateCharCounter() {
            const summary = document.getElementById('in-sum');
            const counter = document.getElementById('char-counter');
            if (!summary || !counter) return;

            const length = summary.value.length;
            counter.textContent = `${length} / 500 characters (optimal: 200-400)`;

            counter.classList.remove('warning', 'optimal');
            if (length >= 200 && length <= 400) {
                counter.classList.add('optimal');
            } else if (length > 400 || (length > 0 && length < 100)) {
                counter.classList.add('warning');
            }
        }

        // === COLLAPSIBLE SECTIONS ===
        const collapsedSections = {};

        function toggleGroup(groupName) {
            const content = document.getElementById(`content-${groupName}`);
            const btn = document.getElementById(`collapse-${groupName}`);

            if (!content || !btn) return;

            collapsedSections[groupName] = !collapsedSections[groupName];

            if (collapsedSections[groupName]) {
                content.classList.add('collapsed');
                btn.innerHTML = '<i class="fas fa-chevron-down"></i>';
            } else {
                content.classList.remove('collapsed');
                btn.innerHTML = '<i class="fas fa-chevron-up"></i>';
            }
        }

        // === KEYBOARD SHORTCUTS ===
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Ctrl+S: Save
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveCV();
                    showToast('CV saved!', 'success');
                }

                // Ctrl+Z: Undo
                if (e.ctrlKey && e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    undo();
                }

                // Ctrl+Y or Ctrl+Shift+Z: Redo
                if ((e.ctrlKey && e.key === 'y') || (e.ctrlKey && e.shiftKey && e.key === 'z')) {
                    e.preventDefault();
                    redo();
                }

                // Ctrl+P: Print/Download PDF
                if (e.ctrlKey && e.key === 'p') {
                    e.preventDefault();
                    downloadPDF();
                }
            });
        }

        // === DUPLICATE ITEM ===
        function duplicateItem(type, id) {
            const original = state[type].find(x => x.id === id);
            if (!original) return;

            saveStateForUndo();

            const newItem = {
                ...JSON.parse(JSON.stringify(original)),
                id: Date.now() + Math.random()
            };

            const index = state[type].findIndex(x => x.id === id);
            state[type].splice(index + 1, 0, newItem);

            updateEditor();
            render();
            autoSave();
            showToast('Item duplicated!', 'success');
        }

        // === MOVE ITEM UP/DOWN ===
        function moveItemUp(type, id) {
            const index = state[type].findIndex(x => x.id === id);
            if (index <= 0) return;

            saveStateForUndo();

            const temp = state[type][index];
            state[type][index] = state[type][index - 1];
            state[type][index - 1] = temp;

            updateEditor();
            render();
            autoSave();
            showToast('Item moved up', 'info');
        }

        function moveItemDown(type, id) {
            const index = state[type].findIndex(x => x.id === id);
            if (index >= state[type].length - 1) return;

            saveStateForUndo();

            const temp = state[type][index];
            state[type][index] = state[type][index + 1];
            state[type][index + 1] = temp;

            updateEditor();
            render();
            autoSave();
            showToast('Item moved down', 'info');
        }

                { id: Date.now() + 10, t1: 'Spanish', val: 75 }
            ];

            updateEditor();
            updateSectionOrder();
            render();
            updateProgress();
            updateCharCounter();
            autoSave();

            showToast('Sample data loaded!', 'success');
        }

        // === PRINT CV ===
        function printCV() {
            window.print();
        }

        // === ENHANCED DRAG AND DROP ===
        function updateSectionOrder() {
            const container = document.getElementById('section-order-list');
            if (!container) return;

            container.innerHTML = '';

            const sections = [
                { id: 'summary', icon: 'fa-user', label: 'Profile Summary' },
                { id: 'exp', icon: 'fa-briefcase', label: 'Experience' },
                { id: 'edu', icon: 'fa-graduation-cap', label: 'Education' }
            ];

            // Ensure sectionOrder exists
            if (!state.sectionOrder || state.sectionOrder.length === 0) {
                state.sectionOrder = ['summary', 'exp', 'edu'];
            }

            // Ensure sectionVisibility exists
            if (!state.sectionVisibility) {
                state.sectionVisibility = {
                    summary: true,
                    exp: true,
                    edu: true,
                    skill: true,
                    lang: true,
                    ref: true
                };
            }

            state.sectionOrder.forEach((sectionId, index) => {
                const section = sections.find(s => s.id === sectionId);
                if (!section) return;

                const item = document.createElement('div');
                item.className = 'section-order-item';
                item.draggable = true;
                item.dataset.sectionId = sectionId;
                item.dataset.index = index;

                const visible = state.sectionVisibility[sectionId] !== false;

                item.innerHTML = `
                    <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
                    <i class="fas ${section.icon}" style="color: var(--primary);"></i>
                    <span style="font-weight: 600; flex: 1;">${section.label}</span>
                    <button class="section-toggle ${visible ? '' : 'hidden'}" onclick="event.stopPropagation(); toggleSectionVisibility('${sectionId}')" title="${visible ? 'Hide' : 'Show'} section">
                        <i class="fas fa-eye${visible ? '' : '-slash'}"></i>
                    </button>
                `;

                // Improved drag and drop with better event handling
                item.addEventListener('dragstart', function (e) {
                    draggedElement = this;
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', sectionId);

                    // Create custom drag image
                    const ghost = document.createElement('div');
                    ghost.className = 'drag-ghost';
                    ghost.textContent = section.label;
                    ghost.style.position = 'absolute';
                    ghost.style.top = '-1000px';
                    document.body.appendChild(ghost);
                    e.dataTransfer.setDragImage(ghost, 0, 0);

                    setTimeout(() => ghost.remove(), 0);
                });

                item.addEventListener('dragend', function () {
                    this.classList.remove('dragging');
                    document.querySelectorAll('.section-order-item').forEach(el => {
                        el.classList.remove('drag-over');
                    });
                    draggedElement = null;
                });

                item.addEventListener('dragover', function (e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });

                item.addEventListener('dragenter', function (e) {
                    e.preventDefault();
                    if (this !== draggedElement) {
                        this.classList.add('drag-over');
                    }
                });

                item.addEventListener('dragleave', function () {
                    this.classList.remove('drag-over');
                });

                item.addEventListener('drop', function (e) {
                    e.preventDefault();
                    e.stopPropagation();

                    this.classList.remove('drag-over');

                    if (draggedElement && draggedElement !== this) {
                        const draggedId = draggedElement.dataset.sectionId;
                        const targetId = this.dataset.sectionId;

                        const draggedIndex = state.sectionOrder.indexOf(draggedId);
                        const targetIndex = state.sectionOrder.indexOf(targetId);

                        if (draggedIndex !== -1 && targetIndex !== -1) {
                            saveStateForUndo();

                            // Remove from old position and insert at new position
                            state.sectionOrder.splice(draggedIndex, 1);
                            state.sectionOrder.splice(targetIndex, 0, draggedId);

                            updateSectionOrder();
                            render();
                            autoSave();
                            showToast('Section order updated', 'success');
                        }
                    }
                });

                container.appendChild(item);
            });
        }

        // Enhanced updateEditor with duplicate and move buttons
        const originalUpdateEditor = updateEditor;
        updateEditor = function () {
            const container = document.getElementById('dynamic-editors');
            container.innerHTML = '';

            ['exp', 'edu', 'skill', 'lang', 'ref'].forEach(type => {
                state[type].forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'item-editor';

                    const typeLabel = {
                        exp: '💼 Experience',
                        edu: '🎓 Education',
                        skill: '⭐ Skill',
                        lang: '🌍 Language',
                        ref: '👥 Reference'
                    };

                    const itemActions = `
                        <div class="item-actions">
                            <button class="action-btn duplicate" onclick="duplicateItem('${type}', ${item.id})" title="Duplicate">
                                <i class="fas fa-copy"></i>
                            </button>
                            <button class="action-btn move-up" onclick="moveItemUp('${type}', ${item.id})" title="Move Up" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>
                                <i class="fas fa-arrow-up"></i>
                            </button>
                            <button class="action-btn move-down" onclick="moveItemDown('${type}', ${item.id})" title="Move Down" ${index === state[type].length - 1 ? 'disabled style="opacity:0.3"' : ''}>
                                <i class="fas fa-arrow-down"></i>
                            </button>
                        </div>
                    `;

                    div.innerHTML = `
                        <button class="delete-btn" onclick="saveStateForUndo(); deleteItem('${type}', ${item.id})">×</button>
                        ${itemActions}
                        <div class="item-type">${typeLabel[type]}</div>
                        <input type="text" placeholder="${type === 'skill' || type === 'lang' ? 'Name' : 'Title'}" value="${item.t1 || ''}" oninput="state.${type}.find(x=>x.id===${item.id}).t1=this.value; render(); autoSave(); updateProgress();">
                        ${(type === 'skill' || type === 'lang') ? `
                            <div style="margin-top: 10px;">
                                <label style="font-size: 11px; color: #64748b; font-weight: 600;">Proficiency: ${item.val}%</label>
                                <input type="range" min="0" max="100" value="${item.val}" style="width: 100%; margin-top: 5px;" oninput="state.${type}.find(x=>x.id===${item.id}).val=this.value; this.previousElementSibling.innerText='Proficiency: '+this.value+'%'; render(); autoSave();">
                            </div>
                        ` : `
                            <input type="text" placeholder="${type === 'ref' ? 'Position/Title' : 'Company / Institution'}" value="${item.t2 || ''}" style="margin-top: 5px;" oninput="state.${type}.find(x=>x.id===${item.id}).t2=this.value; render(); autoSave();">
                            <input type="text" placeholder="Date Range (e.g., 2020-2023)" value="${item.d || ''}" style="margin-top: 5px;" oninput="state.${type}.find(x=>x.id===${item.id}).d=this.value; render(); autoSave();">
                            <textarea placeholder="Description / Details / Achievements" rows="3" style="margin-top: 5px;" oninput="state.${type}.find(x=>x.id===${item.id}).desc=this.value; render(); autoSave();">${item.desc || ''}</textarea>
                            ${type === 'exp' ? `<button class="btn-ai" onclick="generateJobDescription(${item.id})" style="margin-top: 8px; background: #10b981; font-size: 11px; padding: 8px;">🤖 AI Generate Description</button>` : ''}
                        `}
                    `;
                    container.appendChild(div);
                });
            });

            // === CUSTOM SECTIONS ===
            if (state.custom && state.custom.length > 0) {
                const groupedCustom = {};
                state.custom.forEach(item => {
                    const sectionName = item.sectionName || 'Custom Section';
                    if (!groupedCustom[sectionName]) groupedCustom[sectionName] = [];
                    groupedCustom[sectionName].push(item);
                });

                Object.keys(groupedCustom).forEach(sectionName => {
                    const sectionHeader = document.createElement('div');
                    sectionHeader.className = 'custom-section-header';
                    sectionHeader.style.cssText = 'background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; padding: 10px 12px; border-radius: 8px; margin: 15px 0 8px 0; display: flex; align-items: center; justify-content: space-between;';
                    sectionHeader.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <i class="fas fa-star"></i>
                            <input type="text" value="${sectionName}" 
                                style="background: transparent; border: none; color: white; font-weight: 600; font-size: 13px; width: auto; min-width: 100px; padding: 0;"
                                onchange="renameCustomSection('${sectionName}', this.value)"
                                onclick="event.stopPropagation()"
                                placeholder="Section Name">
                        </div>
                        <button onclick="deleteCustomSection('${sectionName}')" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px;">
                            <i class="fas fa-trash"></i> Delete Section
                        </button>
                    `;
                    container.appendChild(sectionHeader);

                    groupedCustom[sectionName].forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'item-editor';
                        div.style.borderLeft = '3px solid #8b5cf6';

                        const itemActions = `
                            <div class="item-actions">
                                <button class="action-btn duplicate" onclick="duplicateItem('custom', ${item.id})" title="Duplicate">
                                    <i class="fas fa-copy"></i>
                                </button>
                                <button class="action-btn move-up" onclick="moveItemUp('custom', ${item.id})" title="Move Up" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>
                                    <i class="fas fa-arrow-up"></i>
                                </button>
                                <button class="action-btn move-down" onclick="moveItemDown('custom', ${item.id})" title="Move Down" ${index === groupedCustom[sectionName].length - 1 ? 'disabled style="opacity:0.3"' : ''}>
                                    <i class="fas fa-arrow-down"></i>
                                </button>
                            </div>
                        `;

                        div.innerHTML = `
                            <button class="delete-btn" onclick="saveStateForUndo(); deleteItem('custom', ${item.id})">×</button>
                            ${itemActions}
                            <div class="item-type">✨ ${sectionName}</div>
                            <input type="text" placeholder="Title / Name" value="${item.t1 || ''}" oninput="state.custom.find(x=>x.id===${item.id}).t1=this.value; render(); autoSave();">
                            <input type="text" placeholder="Subtitle / Organization" value="${item.t2 || ''}" style="margin-top: 5px;" oninput="state.custom.find(x=>x.id===${item.id}).t2=this.value; render(); autoSave();">
                            <input type="text" placeholder="Date Range" value="${item.d || ''}" style="margin-top: 5px;" oninput="state.custom.find(x=>x.id===${item.id}).d=this.value; render(); autoSave();">
                            <textarea placeholder="Description / Details" rows="3" style="margin-top: 5px;" oninput="state.custom.find(x=>x.id===${item.id}).desc=this.value; render(); autoSave();">${item.desc || ''}</textarea>
                        `;
                        container.appendChild(div);
                    });

                    const addBtn = document.createElement('button');
                    addBtn.style.cssText = 'width: 100%; padding: 8px; margin-bottom: 10px; background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 6px; color: #64748b; cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.2s;';
                    addBtn.innerHTML = `<i class="fas fa-plus"></i> Add item to "${sectionName}"`;
                    addBtn.onmouseover = function () { this.style.background = '#e2e8f0'; };
                    addBtn.onmouseout = function () { this.style.background = '#f1f5f9'; };
                    addBtn.onclick = function () { addCustomItem(sectionName); };
                    container.appendChild(addBtn);
                });
            }
        };

        // === CUSTOM SECTIONS LOGIC WITH REORDERING ===
        function addCustomSection() {
            const sectionName = prompt('Enter a name for your custom section:', 'Certifications');
            if (!sectionName || !sectionName.trim()) return;

            const cleanName = sectionName.trim();
            saveStateForUndo();

            if (!state.custom) state.custom = [];

            // Add ID to sectionOrder if not exists
            const customId = `custom:${cleanName}`;
            if (!state.sectionOrder.includes(customId)) {
                state.sectionOrder.push(customId);
            }

            // Add first item
            state.custom.push({
                id: Date.now() + Math.random(),
                sectionName: cleanName,
                t1: '', t2: '', d: '', desc: ''
            });

            updateEditor();
            updateSectionOrder(); // Update the drag list
            render();
            autoSave();
            showToast(`Custom section "${cleanName}" created!`, 'success');
        }

        function addCustomItem(sectionName) {
            saveStateForUndo();
            if (!state.custom) state.custom = [];

            state.custom.push({
                id: Date.now() + Math.random(),
                sectionName: sectionName,
                t1: '', t2: '', d: '', desc: ''
            });

            updateEditor();
            render();
            autoSave();
        }

        function renameCustomSection(oldName, newName) {
            if (!newName || !newName.trim() || oldName === newName.trim()) return;
            const cleanNewName = newName.trim();

            saveStateForUndo();

            // Update items
            state.custom.forEach(item => {
                if (item.sectionName === oldName) item.sectionName = cleanNewName;
            });

            // Update sectionOrder
            const oldId = `custom:${oldName}`;
            const newId = `custom:${cleanNewName}`;
            const idx = state.sectionOrder.indexOf(oldId);
            if (idx !== -1) {
                state.sectionOrder[idx] = newId;
            }

            updateEditor();
            updateSectionOrder();
            render();
            autoSave();
            showToast(`Renamed to "${cleanNewName}"`, 'success');
        }

        function deleteCustomSection(sectionName) {
            if (!confirm(`Delete "${sectionName}" section and all items?`)) return;

            saveStateForUndo();

            // Remove items
            state.custom = state.custom.filter(item => item.sectionName !== sectionName);

            // Remove from order
            const customId = `custom:${sectionName}`;
            state.sectionOrder = state.sectionOrder.filter(id => id !== customId);

            updateEditor();
            updateSectionOrder();
            render();
            autoSave();
            showToast(`Section "${sectionName}" deleted`, 'warning');
        }

        // === ENHANCED GENERATE HTML ===
        function generateSectionHTML() {
            let html = '';

            // Ensure sectionOrder has standard sections if missing
            if (!state.sectionOrder) state.sectionOrder = ['summary', 'exp', 'edu', 'ref'];

            // Dynamically build section objects for the reorder list
            const sectionObjects = [
                { id: 'summary', icon: 'fa-user', label: 'Profile Summary' },
                { id: 'exp', icon: 'fa-briefcase', label: 'Experience' },
                { id: 'edu', icon: 'fa-graduation-cap', label: 'Education' },
                { id: 'ref', icon: 'fa-users', label: 'References' }
            ];

            // Add custom sections to the list logic
            if (state.custom) {
                const uniqueSections = [...new Set(state.custom.map(item => item.sectionName || 'Custom'))];
                uniqueSections.forEach(name => {
                    const id = `custom:${name}`;
                    if (!state.sectionOrder.includes(id)) state.sectionOrder.push(id);
                });
            }

            state.sectionOrder.forEach(sectionId => {
                if (state.sectionVisibility && state.sectionVisibility[sectionId] === false) return;

                if (sectionId === 'summary') {
                    const summaryText = document.getElementById('in-sum').value;
                    if (summaryText) {
                        html += `<div class="section-h"><i class="fas fa-user"></i> Profile Summary</div>
                                 <div class="profile-summary">${summaryText.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('')}</div>`;
                    }
                } else if (sectionId === 'exp' && state.exp.length > 0) {
                    html += `<div class="section-h"><i class="fas fa-briefcase"></i> Professional Experience</div>
                             <div>${getExperienceHTML(0, 2)}</div>`;
                } else if (sectionId === 'edu' && state.edu.length > 0) {
                    html += `<div class="section-h"><i class="fas fa-graduation-cap"></i> Education</div>
                             <div>${getEducationHTML(0, 2)}</div>`;
                } else if (sectionId === 'ref' && state.ref.length > 0) {
                    html += `<div class="section-h"><i class="fas fa-users"></i> References</div>
                             <div>${state.ref.map(r => `
                                <div class="item">
                                    <div class="item-header">
                                        <span class="item-title">${r.t1}</span>
                                        ${r.t2 ? `<span class="item-org"> • ${r.t2}</span>` : ''}
                                    </div>
                                    <div class="item-desc">${r.desc.replace(/\n/g, '<br>')}</div>
                                </div>
                             `).join('')}</div>`;
                } else if (sectionId.startsWith('custom:')) {
                    const sectionName = sectionId.split(':')[1];
                    const items = state.custom.filter(x => x.sectionName === sectionName);
                    if (items.length > 0) {
                        html += `<div class="section-h"><i class="fas fa-star"></i> ${sectionName}</div>
                                 <div>${items.map(item => `
                                    <div class="item">
                                        <div class="item-header">
                                            <div style="display:flex; justify-content:space-between; width:100%;">
                                                <span class="item-title">${item.t1}</span>
                                                ${item.d ? `<span class="item-date">${item.d}</span>` : ''}
                                            </div>
                                        </div>
                                        ${item.t2 ? `<div class="item-org">${item.t2}</div>` : ''}
                                        ${item.desc ? `<div class="item-desc">${item.desc.replace(/\n/g, '<br>')}</div>` : ''}
                                    </div>
                                 `).join('')}</div>`;
                    }
                }
            });
            return html;
        }

        // === UPDATED ORDER VISUALIZER ===
        function updateSectionOrder() {
            const container = document.getElementById('section-order-list');
            if (!container) return;
            container.innerHTML = '';

            // Map IDs to comfortable labels
            state.sectionOrder.forEach(id => {
                let label = '';
                let icon = '';

                if (id === 'summary') { label = 'Profile Summary'; icon = 'fa-user'; }
                else if (id === 'exp') { label = 'Experience'; icon = 'fa-briefcase'; }
                else if (id === 'edu') { label = 'Education'; icon = 'fa-graduation-cap'; }
                else if (id === 'ref') { label = 'References'; icon = 'fa-users'; }
                else if (id.startsWith('custom:')) {
                    label = id.split(':')[1];
                    icon = 'fa-star';
                }

                if (!label) return;

                const item = document.createElement('div');
                item.className = 'section-order-item';
                item.draggable = true;
                item.dataset.sectionId = id;
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <i class="fas fa-grip-vertical" style="color:#cbd5e1; cursor:grab;"></i>
                        <span style="font-size:12px; font-weight:500; color:#334155;"><i class="fas ${icon}" style="margin-right:6px; color:#6366f1;"></i> ${label}</span>
                    </div>
                `;

                // Drag Events
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
                item.addEventListener('dragenter', function (e) { e.preventDefault(); this.classList.add('drag-over'); });
                item.addEventListener('dragleave', function () { this.classList.remove('drag-over'); });
                item.addEventListener('drop', handleDrop);

                container.appendChild(item);
            });
        }

        // === GLOBAL DRAG HANDLERS ===
        // draggedElement is defined at line 1893

        function handleDragStart(e) {
            this.style.opacity = '0.4';
            draggedElement = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            this.style.opacity = '1';

            if (draggedElement && draggedElement !== this) {
                const sourceId = draggedElement.dataset.sectionId;
                const targetId = this.dataset.sectionId;

                const sourceIndex = state.sectionOrder.indexOf(sourceId);
                const targetIndex = state.sectionOrder.indexOf(targetId);

                if (sourceIndex > -1 && targetIndex > -1) {
                    saveStateForUndo();
                    state.sectionOrder.splice(sourceIndex, 1);
                    state.sectionOrder.splice(targetIndex, 0, sourceId);

                    updateSectionOrder();
                    render();
                    autoSave();
                    showToast('Section order moved', 'success');
                }
            }
            return false;
        }

        window.addEventListener('DOMContentLoaded', () => {
            init();
            setupKeyboardShortcuts();
            updateProgress();
            updateCharCounter();
            updateUndoRedoButtons();
        });
    </script>

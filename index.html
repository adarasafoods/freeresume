<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeFlow - Professional Resume Builder</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@400;700;800&family=Montserrat:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;700;900&family=Lato:wght@300;400;700;900&family=Open+Sans:wght@400;600;800&family=Raleway:wght@400;700;900&family=Source+Sans+Pro:wght@400;600;900&family=Merriweather:wght@400;700;900&family=Nunito:wght@400;700;900&family=Ubuntu:wght@400;700&family=Crimson+Text:wght@400;600;700&family=Libre+Baskerville:wght@400;700&family=PT+Sans:wght@400;700&family=Oswald:wght@400;600;700&family=Quicksand:wght@400;600;700&family=Karla:wght@400;700&family=Fira+Sans:wght@400;600;800&family=Bitter:wght@400;700&family=Cabin:wght@400;600;700&family=Arimo:wght@400;700&family=Josefin+Sans:wght@400;600;700&family=Work+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --side-bg: #1e293b;
            --side-text: #ffffff;
            --font-main: 'Inter';
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background: #0f172a;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #333;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
        }

        #editor {
            width: 480px;
            background: #ffffff;
            overflow-y: auto;
            padding: 25px;
            height: 100vh;
            border-right: 1px solid #e2e8f0;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        @media (max-width: 1024px) {
            #editor {
                width: 400px;
            }
        }

        @media (max-width: 768px) {
            #editor {
                width: 100%;
                height: auto;
                min-height: 100vh;
                border-right: none;
                border-bottom: 3px solid #e2e8f0;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                padding: 20px;
            }
        }

        .group {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #f1f5f9;
        }

        @media (max-width: 768px) {
            .group {
                padding: 15px;
                margin-bottom: 15px;
            }
        }

        h3 {
            font-size: 16px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 800;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        @media (max-width: 768px) {
            h3 {
                font-size: 14px;
                letter-spacing: 1px;
                margin-bottom: 12px;
            }
        }

        select.dropdown-style {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #e2e8f0;
            background: #fff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            color: #1e293b;
        }

        select.dropdown-style:hover {
            border-color: var(--primary);
            background: #f8fafc;
        }

        select.dropdown-style:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin-bottom: 10px;
            margin-top: 8px;
        }

        .swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .swatch:hover {
            transform: scale(1.1);
        }

        .swatch.active {
            border-color: #000;
            transform: scale(1.15);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 5px;
            font-family: inherit;
        }

        @media (max-width: 768px) {

            input,
            textarea {
                font-size: 16px;
                padding: 14px;
            }
        }

        .toggle-switch {
            display: inline-block;
            position: relative;
            width: 52px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            border-radius: 28px;
            transition: .3s;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: .3s;
        }

        input:checked+.toggle-slider {
            background-color: var(--primary);
        }

        input:checked+.toggle-slider:before {
            transform: translateX(24px);
        }

        .btn-ai {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            margin-top: 8px;
            transition: 0.3s;
            width: 100%;
        }

        .btn-ai:hover {
            opacity: 0.8;
            transform: translateY(-1px);
        }

        button {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #f8fafc;
        }

        #preview-pane {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0f172a;
            position: relative;
        }

        @media (max-width: 768px) {
            #preview-pane {
                padding: 20px 10px;
                width: 100%;
            }
        }

        .toolbar {
            width: 210mm;
            background: #fff;
            padding: 18px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .toolbar {
                width: calc(100% - 20px);
                padding: 15px;
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            .toolbar>span {
                text-align: center;
            }

            .toolbar>div {
                width: 100%;
                flex-direction: column;
            }

            .toolbar .btn-exp {
                width: 100%;
                justify-content: center;
            }
        }

        .cv-page {
            width: 210mm;
            height: 297mm;
            background: white;
            font-family: var(--font-main);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            page-break-after: always;
            page-break-inside: avoid;
        }

        @media (max-width: 768px) {
            .cv-page {
                width: calc(100vw - 20px);
                height: auto;
                min-height: 400px;
                margin-bottom: 20px;
            }
        }

        .cv-page:last-child {
            margin-bottom: 0;
            page-break-after: auto;
        }

        @media print {
            body {
                background: white !important;
                margin: 0;
                padding: 0;
            }

            #editor,
            .toolbar {
                display: none !important;
            }

            #preview-pane {
                padding: 0 !important;
                background: white !important;
                overflow: visible !important;
            }

            .cv-page {
                width: 210mm;
                height: 297mm;
                background: white;
                box-shadow: none !important;
                margin: 0;
                padding: 0;
                page-break-after: always;
                page-break-inside: avoid;
                overflow: hidden;
            }

            .cv-page:last-child {
                page-break-after: auto;
            }

            .cv-grid {
                display: table !important;
                width: 100%;
                height: 100%;
                table-layout: fixed;
                border-collapse: collapse;
            }

            .side,
            .main {
                display: table-cell !important;
                vertical-align: top !important;
                page-break-inside: avoid;
            }

            .page-indicator {
                display: none !important;
            }
        }

        .cv-grid {
            display: grid;
            height: 100%;
            width: 100%;
        }

        @media (max-width: 768px) {
            .cv-grid {
                display: block !important;
                height: auto !important;
            }

            .cv-grid .side,
            .cv-grid .main {
                width: 100% !important;
                display: block !important;
            }

            .cv-grid .side {
                padding: 20px !important;
                min-height: auto !important;
            }

            .cv-grid .main {
                padding: 20px !important;
            }
        }

        .tpl-1 {
            grid-template-columns: 35% 65%;
        }

        .tpl-2 {
            grid-template-columns: 65% 35%;
        }

        .tpl-3 {
            grid-template-columns: 1fr;
        }

        .tpl-4 {
            grid-template-columns: 1fr;
            border-top: 20px solid var(--primary);
        }

        .tpl-5 {
            grid-template-columns: 30% 70%;
            background: #fefefe;
        }

        .tpl-6 {
            grid-template-columns: 1fr;
            padding: 40px;
        }

        .tpl-7 {
            grid-template-columns: 40% 60%;
        }

        .tpl-8 {
            grid-template-columns: 1fr;
            background: #fafafa;
            padding: 30px;
        }

        .tpl-9 {
            grid-template-columns: 25% 75%;
        }

        .tpl-10 {
            grid-template-columns: 1fr 1fr;
        }

        .tpl-11 {
            grid-template-columns: 1fr;
        }

        .tpl-12 {
            grid-template-columns: 38% 62%;
            border-left: 8px solid var(--primary);
        }

        .tpl-13 {
            grid-template-columns: 1fr;
        }

        .tpl-14 {
            grid-template-columns: 28% 72%;
            background: #f8f9fa;
        }

        .tpl-15 {
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .tpl-16 {
            grid-template-columns: 100%;
            padding: 0;
        }

        .tpl-17 {
            grid-template-columns: 45% 55%;
        }

        .tpl-18 {
            grid-template-columns: 1fr;
            border: 15px solid var(--primary);
            padding: 20px;
        }

        .tpl-19 {
            grid-template-columns: 33% 67%;
            background: #fdfbf7;
        }

        .tpl-20 {
            grid-template-columns: 1fr;
        }

        .tpl-21 {
            grid-template-columns: 1fr;
        }

        .tpl-22 {
            grid-template-columns: 100%;
            padding: 0;
            background: #fff;
        }

        .tpl-23 {
            grid-template-columns: 100%;
            padding: 0;
            background: #fff;
        }

        .side {
            background: var(--side-bg);
            color: var(--side-text);
            padding: 25px 18px;
            overflow: hidden;
        }

        .main {
            padding: 25px;
            background: white;
            overflow: hidden;
        }

        .name {
            font-size: 24pt;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: inherit;
            line-height: 1.1;
            word-wrap: break-word;
        }

        @media (max-width: 768px) {
            .name {
                font-size: 20pt;
            }
        }

        .title {
            font-size: 11pt;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 22px;
            text-transform: uppercase;
            word-wrap: break-word;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 10pt;
                letter-spacing: 1px;
            }
        }

        .section-h {
            font-size: 10pt;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            margin: 18px 0 10px;
            border-bottom: 1.5px solid #eee;
            padding-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            page-break-after: avoid;
        }

        .skill-bar {
            height: 6px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin: 8px 0 15px;
            overflow: hidden;
        }

        .skill-progress {
            height: 100%;
            background: var(--primary);
            transition: 1s;
        }

        .btn-exp {
            padding: 12px 20px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 700;
            color: white;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 50px;
            height: 50px;
            font-size: 18px;
            position: relative;
        }

        .btn-exp span {
            display: none;
        }

        .btn-exp:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-exp:hover span {
            display: block;
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .btn-exp {
                padding: 14px 20px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
                border-radius: 8px;
                height: auto;
            }

            .btn-exp span {
                display: inline;
                position: static;
                transform: none;
                background: transparent;
                padding: 0;
                font-size: 14px;
            }

            .btn-exp:hover span {
                display: inline;
                position: static;
                transform: none;
                background: transparent;
            }
        }

        .item-editor {
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .section-order-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px 12px;
            cursor: move;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            user-select: none;
            margin-bottom: 6px;
        }

        .section-order-item:hover {
            background: #e2e8f0;
            border-color: var(--primary);
        }

        .section-order-item.dragging {
            opacity: 0.5;
            transform: scale(0.98);
        }

        .section-order-item.drag-over {
            border-top: 3px solid var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .drag-handle {
            font-size: 16px;
            color: #94a3b8;
            cursor: grab;
            padding: 5px;
            transition: 0.2s;
        }

        .drag-handle:hover {
            color: var(--primary);
            transform: scale(1.2);
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background: #1e293b;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
            animation: toastSlideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: all;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.success {
            border-left: 4px solid #10b981;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast.info {
            border-left: 4px solid #3b82f6;
        }

        .toast.warning {
            border-left: 4px solid #f59e0b;
        }

        .toast.fade-out {
            animation: toastSlideOut 0.3s ease-in forwards;
        }

        @keyframes toastSlideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes toastSlideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }

            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }

        /* Progress Indicator */
        .progress-container {
            background: #f1f5f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .progress-title {
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-outer {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-checklist {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 12px;
        }

        .progress-item {
            font-size: 11px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .progress-item.completed {
            color: #10b981;
        }

        .progress-item i {
            font-size: 10px;
        }

        /* Collapsible Sections */
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .group-header h3 {
            margin: 0;
            flex: 1;
        }

        .collapse-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            padding: 5px 10px;
            font-size: 14px;
            transition: 0.3s;
            border-radius: 6px;
        }

        .collapse-btn:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .group-content {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s ease,
                padding 0.3s ease;
            opacity: 1;
        }

        .group-content.collapsed {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        /* Keyboard Shortcuts Hint */
        .keyboard-hints {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #475569;
        }

        .keyboard-hints-title {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .keyboard-shortcuts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .shortcut {
            font-size: 10px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 9px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Item Actions */
        .item-actions {
            display: flex;
            gap: 5px;
            position: absolute;
            top: 8px;
            right: 40px;
        }

        .action-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #64748b;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-btn.duplicate:hover {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .action-btn.move-up:hover,
        .action-btn.move-down:hover {
            background: #10b981;
            border-color: #10b981;
        }

        /* Character Counter */
        .char-counter {
            font-size: 11px;
            color: #94a3b8;
            text-align: right;
            margin-top: 4px;
            transition: color 0.2s;
        }

        .char-counter.warning {
            color: #f59e0b;
        }

        .char-counter.optimal {
            color: #10b981;
        }

        /* Template Preview Tooltip */
        .template-preview-tooltip {
            position: absolute;
            top: 100%;
            left: 0;
            width: 200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: 0.3s;
            pointer-events: none;
        }

        .template-option:hover .template-preview-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateY(5px);
        }

        /* Smooth Page Transitions */
        .cv-page {
            animation: pageSlideIn 0.5s ease-out;
        }

        @keyframes pageSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Drag Ghost Element */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 10px 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            font-weight: 600;
            font-size: 13px;
            transform: rotate(3deg);
        }

        /* Undo/Redo Buttons */
        .undo-redo-container {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .undo-btn,
        .redo-btn {
            flex: 1;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .undo-btn:hover:not(:disabled),
        .redo-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .undo-btn:disabled,
        .redo-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Quick Actions Bar */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .quick-action-btn {
            flex: 1;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .quick-action-btn:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
        }

        .quick-action-btn i {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        /* Preview Zoom Controls */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .zoom-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #1e293b;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .zoom-btn:hover {
            background: var(--primary);
            color: white;
        }

        .zoom-level {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            min-width: 45px;
            text-align: center;
        }

        /* Floating Action Button */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .fab-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
            transition: 0.3s;
        }

        .fab-main:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 10px 35px rgba(99, 102, 241, 0.5);
        }

        .fab-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: 0.3s;
        }

        .fab-container:hover .fab-menu,
        .fab-container.active .fab-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .fab-option {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: 0.2s;
        }

        .fab-option:hover {
            transform: scale(1.15);
        }

        /* Search Highlight */
        .search-highlight {
            background: linear-gradient(90deg, #fef08a, #fde047);
            padding: 0 2px;
            border-radius: 2px;
        }

        /* Smooth scrollbar */
        #editor::-webkit-scrollbar {
            width: 8px;
        }

        #editor::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        #editor::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        #editor::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .section-toggle {
            margin-left: auto;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            color: #64748b;
            transition: 0.2s;
        }

        .section-toggle:hover {
            color: var(--primary);
            transform: scale(1.1);
        }

        .section-toggle.hidden {
            color: #ef4444;
        }

        .item-type {
            text-transform: uppercase;
            font-size: 11px;
            color: #64748b;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #ef4444;
            border: none;
            background: #fee;
            cursor: pointer;
            font-size: 18px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }

        label.control-label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            display: block;
            margin-bottom: 5px;
        }

        .exp-item,
        .edu-item {
            margin-bottom: 15px;
            page-break-inside: avoid;
        }

        .exp-item-header,
        .edu-item-header {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 3px;
            word-wrap: break-word;
        }

        .exp-item-company,
        .edu-item-institution {
            color: var(--primary);
            font-size: 9pt;
            font-weight: 700;
            margin-bottom: 5px;
            word-wrap: break-word;
        }

        .exp-item-desc,
        .edu-item-desc {
            font-size: 8.5pt;
            color: #64748b;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .exp-item-desc p,
        .edu-item-desc p {
            margin: 0 0 5px 0;
        }

        .profile-summary {
            font-size: 9pt;
            line-height: 1.45;
            color: #475569;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .profile-summary p {
            margin: 0 0 8px 0;
        }

        .page-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(99, 102, 241, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            z-index: 10;
            pointer-events: none;
        }

        .contact-item {
            font-size: 9pt;
            line-height: 1.9;
            opacity: 0.95;
            margin-bottom: 5px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .contact-item i {
            width: 16px;
            margin-right: 8px;
        }

        /* ATS Template Styles */
        .ats-template {
            padding: 30px;
        }

        .ats-template .name {
            font-size: 28pt;
            text-align: center;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .ats-template .title {
            font-size: 14pt;
            text-align: center;
            margin-bottom: 15px;
            color: #475569;
            letter-spacing: 0;
            text-transform: none;
        }

        .ats-template .contact-info {
            text-align: center;
            font-size: 10pt;
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .ats-template .section-h {
            font-size: 12pt;
            font-weight: 700;
            color: #1e293b;
            margin: 20px 0 10px;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ats-template .exp-item-header,
        .ats-template .edu-item-header {
            font-size: 11pt;
        }

        .ats-template .exp-item-company,
        .ats-template .edu-item-institution {
            font-size: 10pt;
        }

        .ats-template .exp-item-desc,
        .ats-template .edu-item-desc {
            font-size: 10pt;
            color: #1e293b;
        }

        .ats-template .profile-summary {
            font-size: 10pt;
            color: #1e293b;
        }

        /* ResumeFlow ATS pagination fixes */
        .cv-page.ats-page-1,
        .cv-page.ats-page-2 {
            overflow: hidden;
            /* keep page clean */
        }

        .cv-page.ats-page-2 {
            page-break-before: always;
        }

        .ats-template {
            box-sizing: border-box;
            padding: 18mm 15mm 22mm 15mm;
            /* extra bottom padding prevents footer cut */
        }

        @media print {
            .ats-template {
                padding: 18mm 15mm 25mm 15mm !important;
            }
        }
    </style>
</head>

<body>

    <div id="editor">
        <!-- Toast Container for Notifications -->
        <div class="toast-container" id="toast-container"></div>

        <!-- Clean Header -->
        <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e2e8f0;">
            <h2
                style="font-family:'Inter'; margin:0; color:#1e293b; font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                <span
                    style="background: linear-gradient(135deg, var(--primary), #8b5cf6); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent;">ResumeFlow</span>
            </h2>
            <div id="autosave-status" style="font-size: 11px; color: #10b981; margin-top: 6px; font-weight: 500;">
                <i class="fas fa-check-circle"></i> Auto-saved
            </div>
        </div>

        <!-- Compact Progress Bar -->
        <div style="margin-bottom: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <span style="font-size: 11px; font-weight: 600; color: #64748b;">Completion</span>
                <span id="progress-percentage"
                    style="font-size: 11px; font-weight: 700; color: var(--primary);">0%</span>
            </div>
            <div style="height: 4px; background: #e2e8f0; border-radius: 4px; overflow: hidden;">
                <div id="progress-bar"
                    style="height: 100%; background: linear-gradient(90deg, var(--primary), #8b5cf6); border-radius: 4px; transition: width 0.3s ease; width: 0%;">
                </div>
            </div>
            <!-- Hidden progress items for JS -->
            <div style="display: none;">
                <div id="check-name"></div>
                <div id="check-title"></div>
                <div id="check-contact"></div>
                <div id="check-summary"></div>
                <div id="check-experience"></div>
                <div id="check-education"></div>
                <div id="check-skills"></div>
                <div id="check-languages"></div>
            </div>
        </div>

        <!-- Compact Action Bar -->
        <div style="display: flex; gap: 6px; margin-bottom: 16px;">
            <button onclick="undo()" id="undo-btn" disabled
                style="flex: 1; padding: 8px; font-size: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 500; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;">
                <i class="fas fa-undo" style="font-size: 10px;"></i> Undo
            </button>
            <button onclick="redo()" id="redo-btn" disabled
                style="flex: 1; padding: 8px; font-size: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 500; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;">
                <i class="fas fa-redo" style="font-size: 10px;"></i> Redo
            </button>
            <button onclick="saveCV()"
                style="flex: 1; padding: 8px; font-size: 12px; background: var(--primary); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: white; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;">
                <i class="fas fa-save" style="font-size: 10px;"></i> Save
            </button>
        </div>

        <!-- More Actions (Collapsed by default) -->
        <details style="margin-bottom: 16px;">
            <summary
                style="font-size: 12px; font-weight: 600; color: #64748b; cursor: pointer; padding: 8px 0; user-select: none;">
                <i class="fas fa-ellipsis-h"></i> More Actions
            </summary>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-top: 10px;">
                <button onclick="loadCV()"
                    style="padding: 10px 8px; font-size: 11px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 500; color: #475569;">
                    <i class="fas fa-folder-open"
                        style="display: block; margin-bottom: 4px; font-size: 14px; color: #3b82f6;"></i>
                    Load
                </button>
                <button onclick="exportJSON()"
                    style="padding: 10px 8px; font-size: 11px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 500; color: #475569;">
                    <i class="fas fa-download"
                        style="display: block; margin-bottom: 4px; font-size: 14px; color: #10b981;"></i>
                    Backup
                </button>
                <button onclick="importJSON()"
                    style="padding: 10px 8px; font-size: 11px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 500; color: #475569;">
                    <i class="fas fa-upload"
                        style="display: block; margin-bottom: 4px; font-size: 14px; color: #f59e0b;"></i>
                    Restore
                </button>
                <button onclick="fillSampleData()"
                    style="padding: 10px 8px; font-size: 11px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 500; color: #475569;">
                    <i class="fas fa-magic"
                        style="display: block; margin-bottom: 4px; font-size: 14px; color: #8b5cf6;"></i>
                    Sample
                </button>
                <button onclick="printCV()"
                    style="padding: 10px 8px; font-size: 11px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; font-weight: 500; color: #475569;">
                    <i class="fas fa-print"
                        style="display: block; margin-bottom: 4px; font-size: 14px; color: #6366f1;"></i>
                    Print
                </button>
                <button onclick="resetAll()"
                    style="padding: 10px 8px; font-size: 11px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; cursor: pointer; font-weight: 500; color: #dc2626;">
                    <i class="fas fa-trash-alt" style="display: block; margin-bottom: 4px; font-size: 14px;"></i>
                    Reset
                </button>
            </div>
            <input type="file" id="json-import" accept=".json" style="display: none;"
                onchange="handleJSONImport(event)">
        </details>

        <!-- Design Settings - Compact Row -->
        <div class="group" style="padding: 15px;">
            <h3 style="font-size: 13px; margin-bottom: 12px;">Design Settings</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label
                        style="font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px;">Template</label>
                    <select id="tpl-select" class="dropdown-style" onchange="changeTemplate()"
                        style="padding: 10px; font-size: 12px; margin-top: 0;">
                        <option value="1">Modern Split</option>
                        <option value="2">Reverse Split</option>
                        <option value="3">Classic Full Width</option>
                        <option value="4">Corporate Header</option>
                        <option value="5">Minimal Clean</option>
                        <option value="6">Artistic Padded</option>
                        <option value="7">Executive Balance</option>
                        <option value="8">Bordered Formal</option>
                        <option value="9">Tech Narrow</option>
                        <option value="10">Two Column</option>
                        <option value="11">Gradient Flow</option>
                        <option value="12">Accent Border</option>
                        <option value="13">Timeline</option>
                        <option value="14">Infographic</option>
                        <option value="15">Magazine</option>
                        <option value="16">Full Bleed</option>
                        <option value="17">Serif Pro</option>
                        <option value="18">Bold Frame</option>
                        <option value="19">Warm Tones</option>
                        <option value="20">Dynamic</option>
                        <option value="21">ATS Clean</option>
                        <option value="22">ATS Minimal</option>
                        <option value="23">ATS Pro</option>
                    </select>
                </div>
                <div>
                    <label
                        style="font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 4px;">Font</label>
                    <select id="font-select" class="dropdown-style" onchange="changeFont()"
                        style="padding: 10px; font-size: 12px; margin-top: 0;">
                        <option value="Inter">Inter</option>
                        <option value="Poppins">Poppins</option>
                        <option value="Montserrat">Montserrat</option>
                        <option value="Playfair Display">Playfair Display</option>
                        <option value="Lato">Lato</option>
                        <option value="Open Sans">Open Sans</option>
                        <option value="Raleway">Raleway</option>
                        <option value="Source Sans Pro">Source Sans Pro</option>
                        <option value="Merriweather">Merriweather</option>
                        <option value="Roboto">Roboto</option>
                        <option value="Nunito">Nunito</option>
                        <option value="Ubuntu">Ubuntu</option>
                        <option value="Work Sans">Work Sans</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 12px;">
                <label
                    style="font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 6px;">Accent
                    Color</label>
                <div class="swatch-grid" id="accent-colors" style="grid-template-columns: repeat(10, 1fr);"></div>
            </div>
            <div style="margin-top: 10px;">
                <label
                    style="font-size: 11px; font-weight: 600; color: #64748b; display: block; margin-bottom: 6px;">Sidebar</label>
                <div class="swatch-grid" id="side-colors" style="grid-template-columns: repeat(10, 1fr);"></div>
            </div>
        </div>

        <!-- Personal Information -->
        <div class="group" style="padding: 15px;">
            <h3 style="font-size: 13px; margin-bottom: 12px;">Personal Information</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <input type="text" id="in-name" placeholder="Full Name" style="padding: 10px; font-size: 13px;"
                    oninput="render(); autoSave(); updateProgress();">
                <input type="text" id="in-title" placeholder="Job Title" style="padding: 10px; font-size: 13px;"
                    oninput="render(); autoSave(); updateProgress();">
                <input type="text" id="in-email" placeholder="Email" style="padding: 10px; font-size: 13px;"
                    oninput="render(); autoSave(); updateProgress();">
                <input type="text" id="in-phone" placeholder="Phone" style="padding: 10px; font-size: 13px;"
                    oninput="render(); autoSave(); updateProgress();">
                <input type="text" id="in-loc" placeholder="Location" style="padding: 10px; font-size: 13px;"
                    oninput="render(); autoSave(); updateProgress();">
                <input type="text" id="in-link" placeholder="LinkedIn/Website" style="padding: 10px; font-size: 13px;"
                    oninput="render(); autoSave();">
            </div>
            <details style="margin-top: 10px;">
                <summary style="font-size: 11px; font-weight: 500; color: #64748b; cursor: pointer;">Photo Options
                </summary>
                <div style="padding-top: 10px;">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                        <label style="font-size: 12px; font-weight: 500; color: #475569;">Show Photo</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="toggle-photo" onchange="togglePhoto()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div id="photo-controls" style="display: none;">
                        <input type="file" id="in-photo" accept="image/*" onchange="uploadPhoto(event)"
                            style="font-size: 12px;">
                        <select id="photo-shape" class="dropdown-style" onchange="changePhotoShape()"
                            style="margin-top: 8px; padding: 8px; font-size: 12px;">
                            <option value="rounded">Rounded</option>
                            <option value="circle">Circle</option>
                            <option value="square">Square</option>
                        </select>
                    </div>
                </div>
            </details>
        </div>

        <!-- Professional Summary -->
        <div class="group" style="padding: 15px;">
            <h3 style="font-size: 13px; margin-bottom: 12px;">Professional Summary</h3>
            <textarea id="in-sum" rows="3" style="padding: 10px; font-size: 13px; resize: vertical;"
                oninput="render(); autoSave(); updateProgress(); updateCharCounter();"
                placeholder="Write a brief professional summary..."></textarea>
            <div class="char-counter" id="char-counter" style="font-size: 10px; margin-top: 4px;">0 / 500 characters
            </div>
            <div style="display: flex; gap: 6px; margin-top: 8px;">
                <button onclick="enhanceSummary()"
                    style="flex: 1; padding: 8px; font-size: 11px; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                    ✨ Enhance
                </button>
                <button onclick="generateSummary()"
                    style="flex: 1; padding: 8px; font-size: 11px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">
                    🤖 Generate
                </button>
            </div>
        </div>

        <!-- Content Sections -->
        <div class="group" style="padding: 15px;">
            <h3 style="font-size: 13px; margin-bottom: 12px;">Content Sections</h3>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px;">
                <button onclick="addItem('exp')"
                    style="padding: 8px 4px; font-size: 11px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">+
                    Work</button>
                <button onclick="addItem('edu')"
                    style="padding: 8px 4px; font-size: 11px; background: #8b5cf6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;">+
                    Education</button>
                <button onclick="addItem('skill')"

                { id: 3, t1: 'Master of Business Administration (MBA)', t2: 'Stanford Graduate School of Business', d: '2016 - 2018', desc: 'Concentration in Technology Management and Innovation Strategy.\n\nGPA: 3.9/4.0 - Dean\'s List all semesters.\n\nThesis: "Digital Transformation Strategies in Enterprise Software".\n\nPresident of Technology & Innovation Club.' },

            tpl: 1,
            accent: '#6366f1',
            side: '#1e293b',

            showPhoto: false,
            photoShape: 'rounded',

            sectionOrder: ['summary', 'exp', 'edu'],

        let autoSaveTimer = null;
        let lastSaved = null;
        let draggedElement = null;

        // === SECTION ORDERING AND VISIBILITY - FIXED ===
        function updateSectionOrder() {
            const container = document.getElementById('section-order-list');
            if (!container) return;

            container.innerHTML = '';

            const sections = [
                { id: 'summary', icon: 'fa-user', label: 'Profile Summary' },
                { id: 'exp', icon: 'fa-briefcase', label: 'Experience' },
                { id: 'edu', icon: 'fa-graduation-cap', label: 'Education' }
            ];

            // Ensure sectionOrder exists
            if (!state.sectionOrder || state.sectionOrder.length === 0) {
                state.sectionOrder = ['summary', 'exp', 'edu'];
            }

            // Ensure sectionVisibility exists
            if (!state.sectionVisibility) {
                state.sectionVisibility = {
                    summary: true,
                    exp: true,
                    edu: true,
                    skill: true,
                    lang: true,
                    ref: true
                };
            }

            state.sectionOrder.forEach((sectionId, index) => {
                const section = sections.find(s => s.id === sectionId);
                if (!section) return;

                const item = document.createElement('div');
                item.className = 'section-order-item';
                item.draggable = true;
                item.dataset.sectionId = sectionId;

                const visible = state.sectionVisibility[sectionId] !== false;

                item.innerHTML = `
                <span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>
                <i class="fas ${section.icon}" style="color: var(--primary);"></i>
                <span style="font-weight: 600; flex: 1;">${section.label}</span>
                <button class="section-toggle ${visible ? '' : 'hidden'}" onclick="event.stopPropagation(); toggleSectionVisibility('${sectionId}')" title="${visible ? 'Hide' : 'Show'} section">
                    <i class="fas fa-eye${visible ? '' : '-slash'}"></i>
                </button>
            `;

                // Drag and drop events - FIXED
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragenter', handleDragEnter);
                item.addEventListener('dragleave', handleDragLeave);

                container.appendChild(item);
            });
        }

        function handleDragStart(e) {
            draggedElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.section-order-item').forEach(item => {
                item.classList.remove('drag-over');
            });
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            if (this !== draggedElement) {
                this.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            e.preventDefault();

            if (draggedElement !== this) {
                const draggedId = draggedElement.dataset.sectionId;
                const targetId = this.dataset.sectionId;

                const draggedIndex = state.sectionOrder.indexOf(draggedId);
                const targetIndex = state.sectionOrder.indexOf(targetId);

                // Reorder array
                state.sectionOrder.splice(draggedIndex, 1);
                state.sectionOrder.splice(targetIndex, 0, draggedId);

                updateSectionOrder();
                render();
                autoSave();
            }

            return false;
        }

        // FIXED: Toggle section visibility
        function toggleSectionVisibility(sectionId) {
            if (!state.sectionVisibility) {
                state.sectionVisibility = {
                    summary: true,
                    exp: true,
                    edu: true,
                    skill: true,
                    lang: true,
                    ref: true
                };
            }

            state.sectionVisibility[sectionId] = !state.sectionVisibility[sectionId];
            updateSectionOrder();
            render();
            autoSave();
        }

        function generateSectionHTML() {
            let html = '';

            state.sectionOrder.forEach(sectionId => {
                if (state.sectionVisibility && state.sectionVisibility[sectionId] === false) return;

                switch (sectionId) {
                    case 'summary':
                        const summaryText = document.getElementById('in-sum').value;
                        if (summaryText) {
                            html += `
                            <div class="section-h"><i class="fas fa-user"></i> Profile Summary</div>
                            <div class="profile-summary">${summaryText.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('') || ''}</div>
                        `;
                        }
                        break;
                    case 'exp':
                        if (state.exp.length > 0) {
                            html += `
                            <div class="section-h"><i class="fas fa-briefcase"></i> Professional Experience</div>
                            <div>${getExperienceHTML(0, 2)}</div>
                        `;
                        }
                        break;
                    case 'edu':
                        if (state.edu.length > 0) {
                            html += `
                            <div class="section-h"><i class="fas fa-graduation-cap"></i> Education</div>
                            <div>${getEducationHTML(0, 2)}</div>
                        `;
                        }
                        break;
                }
            });

            return html;
        }

        // === COVER LETTER FUNCTIONALITY ===
        function showCoverLetterModal() {
            const modal = document.getElementById('cover-letter-modal');
            modal.style.display = 'flex';

            // Pre-fill with CV data
            document.getElementById('cl-position').value = document.getElementById('in-title').value || '';

            const modal = document.getElementById('cover-letter-modal');
            modal.style.display = 'none';

        }

        function generateCoverLetterContent() {
            const position = document.getElementById('cl-position').value || 'this position';
            const company = document.getElementById('cl-company').value || 'your company';
            const name = document.getElementById('in-name').value || 'Applicant';
            const title = document.getElementById('in-title').value || 'Professional';

            const templates = [
                `I am writing to express my strong interest in the ${position} position at ${company}. With my extensive background as a ${title}, I am confident that my skills and experience make me an ideal candidate for this role.

Throughout my career, I have demonstrated a proven track record of delivering exceptional results and driving meaningful impact. My expertise in strategic thinking, problem-solving, and cross-functional collaboration has enabled me to consistently exceed expectations and contribute to organizational success.

I am particularly drawn to ${company} because of your reputation for innovation and excellence. I am excited about the opportunity to bring my unique perspective and contribute to your team's continued growth and success.

I would welcome the opportunity to discuss how my background, skills, and enthusiasm align with your needs. Thank you for considering my application. I look forward to the possibility of contributing to ${company}'s mission.`,

                `Dear Hiring Manager,

I am excited to submit my application for the ${position} role at ${company}. As an accomplished ${title}, I bring a unique combination of technical expertise, leadership experience, and strategic vision that I believe would be valuable to your team.

In my previous roles, I have successfully led initiatives that have driven significant business impact, fostered innovation, and built high-performing teams. I am passionate about creating solutions that not only meet immediate needs but also position organizations for long-term success.

What attracts me most to ${company} is your commitment to excellence and your innovative approach to solving complex challenges. I am confident that my experience and skills would enable me to make meaningful contributions to your organization from day one.

I would be thrilled to discuss how I can contribute to ${company}'s continued success. Thank you for your time and consideration.`,

                `I am writing to apply for the ${position} position at ${company}, as advertised. With my comprehensive experience as a ${title} and my passion for driving results, I am well-prepared to make immediate and lasting contributions to your organization.

My professional journey has equipped me with a diverse skill set and a deep understanding of what it takes to succeed in dynamic, fast-paced environments. I have consistently demonstrated the ability to identify opportunities, develop innovative solutions, and deliver measurable results that align with organizational objectives.

I am particularly impressed by ${company}'s track record of success and innovation in the industry. The opportunity to join your team and contribute to your mission is incredibly exciting to me, and I am confident that my background makes me a strong fit for this role.

I look forward to the opportunity to discuss my qualifications in greater detail. Thank you for considering my application.`
            ];

            const generated = templates[Math.floor(Math.random() * templates.length)];
            document.getElementById('cl-content').value = generated;
        }

        function previewCoverLetter() {
            const company = document.getElementById('cl-company').value || '[Company Name]';
            const position = document.getElementById('cl-position').value || '[Position Title]';
            const manager = document.getElementById('cl-manager').value;
            const content = document.getElementById('cl-content').value;
            const name = document.getElementById('in-name').value || 'Your Name';
            const email = document.getElementById('in-email').value || 'your.email@example.com';

            const coverLetterHTML = `
            <div style="font-family: ${state.font}; color: #1e293b; line-height: 1.6;">
                <!-- Header matching CV -->
                <div style="background: ${state.side}; color: ${isDark(state.side) ? '#fff' : '#1e293b'}; padding: 30px; margin: -40px -40px 30px -40px; border-radius: 8px 8px 0 0;">
                    <div style="font-size: 28pt; font-weight: 800; text-transform: uppercase; margin-bottom: 5px;">${name}</div>
                    <div style="font-size: 12pt; color: ${state.accent}; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;">Cover Letter</div>
                    <div style="margin-top: 15px; font-size: 10pt; opacity: 0.9;">
                        <div>${email} • ${phone}</div>
                        <div>${location}</div>
                    </div>
                </div>

                <!-- Date and Address -->
                <div style="margin-bottom: 25px; font-size: 10pt;">

                    <div>${manager ? manager + '<br>' : ''}${company}<br>${position}</div>
                </div>

                <!-- Salutation -->
                <div style="margin-bottom: 20px; font-size: 10pt;">
                    Dear ${manager || 'Hiring Manager'},
                </div>

                <!-- Content -->
                <div style="font-size: 10pt; white-space: pre-wrap;">${content}</div>

                <!-- Closing -->
                <div style="margin-top: 25px; font-size: 10pt;">
                    <div>Sincerely,</div>
                    <div style="margin-top: 15px; font-weight: 600;">${name}</div>

            document.getElementById('cover-letter-page').innerHTML = coverLetterHTML;
            document.getElementById('cover-letter-preview').style.display = 'block';

        function downloadCoverLetterPDF() {
            // First generate preview
            previewCoverLetter();

            setTimeout(() => {
                const page = document.getElementById('cover-letter-page');
                const name = document.getElementById('in-name').value || 'Applicant';

                html2canvas(page, {
                    scale: 2,
                    useCORS: true,
                    logging: false,
                    width: 794,
                    height: 1123,
                    windowWidth: 794,
                    windowHeight: 1123
                }).then(canvas => {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const imgData = canvas.toDataURL('image/jpeg', 0.98);
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                    pdf.save('CoverLetter_' + name.replace(/ /g, '_') + '.pdf');
                }).catch(err => {
                    console.error('Cover letter PDF error:', err);
                    alert('Error generating cover letter PDF: ' + err.message);
                });
            }, 500);
        }

        // === AUTO-SAVE FUNCTIONALITY ===
        function autoSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                const cvData = {
                    state: state,
                    personalInfo: {
                        name: document.getElementById('in-name').value,
                        title: document.getElementById('in-title').value,
                        email: document.getElementById('in-email').value,
                        phone: document.getElementById('in-phone').value,
                        loc: document.getElementById('in-loc').value,
                        link: document.getElementById('in-link').value,
                        summary: document.getElementById('in-sum').value
                    },
                    timestamp: new Date().toISOString()
                };

                try {
                    const data = JSON.stringify(cvData);
                    window.cvBackup = data;
                    lastSaved = new Date();
                    updateSaveStatus('Auto-saved at ' + lastSaved.toLocaleTimeString());
                } catch (e) {
                    console.error('Auto-save failed:', e);
                    updateSaveStatus('Auto-save failed', true);
                }
            }, 2000);
        }

        function loadAutoSave() {
            try {
                if (window.cvBackup) {
                    const cvData = JSON.parse(window.cvBackup);
                    state = cvData.state;

                    document.getElementById('in-name').value = cvData.personalInfo.name || '';
                    document.getElementById('in-title').value = cvData.personalInfo.title || '';
                    document.getElementById('in-email').value = cvData.personalInfo.email || '';
                    document.getElementById('in-phone').value = cvData.personalInfo.phone || '';
                    document.getElementById('in-loc').value = cvData.personalInfo.loc || '';
                    document.getElementById('in-link').value = cvData.personalInfo.link || '';
                    document.getElementById('in-sum').value = cvData.personalInfo.summary || '';

                    updateEditor();
                    render();
                    updateSaveStatus('Loaded previous session');
                }
            } catch (e) {
                console.error('Failed to load auto-save:', e);
            }
        }

        function updateSaveStatus(message, isError = false) {
            const status = document.getElementById('autosave-status');
            if (status) {
                status.innerHTML = `<i class="fas fa-${isError ? 'exclamation-circle' : 'check-circle'}"></i> ${message}`;
                status.style.color = isError ? '#ef4444' : '#10b981';
            }
        }

        function saveCV() {
            const name = document.getElementById('in-name').value || 'MyCV';
            const cvData = {
                state: state,
                personalInfo: {
                    name: document.getElementById('in-name').value,
                    title: document.getElementById('in-title').value,
                    email: document.getElementById('in-email').value,
                    phone: document.getElementById('in-phone').value,
                    loc: document.getElementById('in-loc').value,
                    link: document.getElementById('in-link').value,
                    summary: document.getElementById('in-sum').value
                },
                timestamp: new Date().toISOString()
            };

            window.cvBackup = JSON.stringify(cvData);
            updateSaveStatus('✓ CV saved successfully!');
            setTimeout(() => updateSaveStatus('Auto-save enabled'), 2000);
        }

        function loadCV() {
            if (window.cvBackup) {
                loadAutoSave();
                alert('CV loaded successfully!');
            } else {
                alert('No saved CV found. Use "Restore" to import a backup file.');
            }

        // === JSON EXPORT/IMPORT ===
        function exportJSON() {
            const cvData = {
                state: state,
                personalInfo: {
                    name: document.getElementById('in-name').value,
                    title: document.getElementById('in-title').value,
                    email: document.getElementById('in-email').value,
                    phone: document.getElementById('in-phone').value,

                    link: document.getElementById('in-link').value,
                    summary: document.getElementById('in-sum').value
                },
                version: '3.0',
                timestamp: new Date().toISOString()

                try {
                    for (let i = 0; i < pages.length; i++) {

                            logging: false,

            const container = document.getElementById('cv-pages-container');
            container.innerHTML = '';

            // Check if ATS template
            const isATS = state.tpl >= 21 && state.tpl <= 23;

            if (isATS) {
                // ATS template rendering (multi-page)
                const pages = createATSPages();
                pages.forEach(p => container.appendChild(p));
            } else {
                // Regular template rendering
                const page1 = createPage(1);
                container.appendChild(page1);

                // Check if we need page 2
                const hasMoreExp = state.exp.length > 2;
                const hasMoreEdu = state.edu.length > 2;
                const hasRefs = state.ref.length > 0;

                if (hasMoreExp || hasMoreEdu || hasRefs) {

                    container.appendChild(page2);
